name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 64tass
        run: |
          sudo apt-get update
          sudo apt-get install -y 64tass

      - name: Build reference examples
        run: make

      - name: Show artifacts
        run: ls -l build/

  differential-sceneasm:
    runs-on: ubuntu-latest
    env:
      SCENEASM_COMMIT: f8fa1f209588e7bea17adff6c88f634259e1dd5e
    steps:
      - name: Checkout C64Scene
        uses: actions/checkout@v4

      - name: Checkout pinned SceneASM
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/SceneASM
          ref: ${{ env.SCENEASM_COMMIT }}
          path: .ci/SceneASM

      - name: Install 64tass
        run: |
          sudo apt-get update
          sudo apt-get install -y 64tass

      - name: Build SceneASM
        run: cargo build --release --manifest-path .ci/SceneASM/Cargo.toml -p sceneasm

      - name: Differential hello-raster
        env:
          SCENEASM: ${{ github.workspace }}/.ci/SceneASM/target/release/sceneasm
        run: make differential-hello

      - name: Differential stable-raster
        env:
          SCENEASM: ${{ github.workspace }}/.ci/SceneASM/target/release/sceneasm
        run: make differential-stable

      - name: Preserve differential artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-hello-raster
          path: build/differential/
          if-no-files-found: warn
