name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 64tass
        run: |
          sudo apt-get update
          sudo apt-get install -y 64tass

      - name: Build reference example
        run: make

      - name: Show artifacts
        run: ls -l build/
